name: Go CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Test
        run: go test ./...
      - name: Install and run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Install and run gosec
        run: |
          # gosec が依存する golang.org/x/tools v0.49.0 は Go 1.27.2 のエクスポートデータ（pkgbits V5）を読めないため、
          # V5 に対応した x/tools へ更新した一時モジュールでビルドします。
          gosec_build_dir="$(mktemp -d)"
          (
            cd "$gosec_build_dir"
            go mod init gosec-build
            go get github.com/securego/gosec/v2/cmd/gosec@latest golang.org/x/tools@v0.52.0
            go install github.com/securego/gosec/v2/cmd/gosec
          )
          gosec ./...
