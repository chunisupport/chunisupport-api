name: Go CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_MYSQL_DSN: root:test-only-password@tcp(127.0.0.1:3306)/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - name: 本番マイグレーション上でMySQL結合テストを実行
        run: go test -count=1 -v ./internal/infra/repository -run MySQL
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - name: Test
        run: go test ./...
      - name: Install and run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Install and run gosec
        run: |
          # gosec が依存する golang.org/x/tools v0.49.0 は Go 1.27.2 のエクスポートデータ（pkgbits V5）を読めないため、
          # V5 に対応した x/tools へ更新した一時モジュールでビルドします。
          gosec_build_dir="$(mktemp -d)"
          (
            cd "$gosec_build_dir"
            go mod init gosec-build
            go get github.com/securego/gosec/v2/cmd/gosec@latest golang.org/x/tools@v0.52.0
            go install github.com/securego/gosec/v2/cmd/gosec
          )
          gosec ./...
