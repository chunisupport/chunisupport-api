name: Apply API documentation correction

on:
  push:
    branches:
      - docs/fix-api-documentation-drift

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-api-documentation-drift
      - name: Update API documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/API.md')
          text = path.read_text()

          text, removed = re.subn(r'\n\*\*最終更新日\*\*: [^\n]+\n', '\n', text, count=1)
          if removed != 1:
              raise SystemExit('last-updated marker not found')

          old = '`APP_ENV=<name> go run main.go`'
          new = '`APP_ENV=<name> go run ./cmd/api`'
          if old not in text:
              raise SystemExit('old startup command not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/patch-api-docs-temp.yml').unlink()
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/API.md .github/workflows/patch-api-docs-temp.yml
          git commit -m 'docs: fix API startup command and stale update date'
          git push origin HEAD:docs/fix-api-documentation-drift
